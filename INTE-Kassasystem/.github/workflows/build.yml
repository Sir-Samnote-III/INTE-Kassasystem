name: Kassasystem CI (Byggserver)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hämtar koden från repot
        uses: actions/checkout@v4

      - name: Sätter upp Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Kompilerar koden och kör alla tester
        run: mvn test